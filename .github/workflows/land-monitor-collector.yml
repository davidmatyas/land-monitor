name: Land Monitor - collector

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml pytest

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

      - name: Collect first Sreality page
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m land_monitor.main

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: land-monitor-report
          path: reports/latest.json
          if-no-files-found: error
