name: Land Monitor - test

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify project layout
        run: |
          pwd
          find . -maxdepth 2 -type f | sort
          test -f land_monitor/__init__.py
          test -f land_monitor/main.py

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import land_monitor; print('Imported:', land_monitor.__file__)"
          pytest -q

      - name: Run application smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m land_monitor.main
